[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "fraud-feature-pipeline-mlflow"
version = "0.1.0"
description = "Point-in-time-correct fraud features in PySpark and Delta, with a baseline model tracked in MLflow."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Navya Sindhu" }]
requires-python = ">=3.11"
dependencies = [
    "pyspark==4.0.1",
    "delta-spark==4.0.1",
    "pandas==3.0.5",
    "pyarrow==25.0.1",
    "numpy==2.5.3",
    "scikit-learn==1.9.1",
    "mlflow==3.17.2",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fraud_features"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "delta: needs the Delta Lake JVM package (resolved from Maven on first use)",
]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
